name: Tests

# Runs the tests on every push to a branch and on every pull request, on Windows and on Linux (the Steam
# version's saves can be edited from Linux too). The release build runs them once more before it builds.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Run the tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t .
      # The window tests need a display, which a Linux runner doesn't have: xvfb gives them one.
      - name: Run the tests on a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          xvfb-run --auto-servernum python -m unittest discover -s tests -t .
