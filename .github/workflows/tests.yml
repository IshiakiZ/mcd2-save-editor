name: Tests

# Runs the tests on every push to a branch and on every pull request, on Windows, on Linux and on a Mac (the
# Steam version's saves can be edited from Linux and macOS too). The release build runs them once more before it
# builds.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Run the tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t .
      # Probes, while the window tests don't finish on a Mac: what keeps Tk busy when it draws the editor's window?
      - name: Probe the editor's window on a Mac
        if: runner.os == 'macOS'
        run: |
          echo "--- Simple mode"
          python -m tests.mac_probe || true
          echo "--- Advanced mode"
          python -m tests.mac_probe advanced || true
          echo "--- the tests that open no window"
          python -m unittest tests.test_steam tests.test_hero tests.test_recommend tests.test_catalog tests.test_saves 2>&1 | grep -E "^(FAIL|ERROR)|Error|Ran |^OK|FAILED|^    self\.|^[-+?] " | head -30 || true
