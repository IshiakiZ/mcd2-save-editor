name: Tests

# Runs the tests on every push to a branch and on every pull request, on Windows, on Linux and on a Mac (the
# Steam version's saves can be edited from Linux and macOS too). The release build runs them once more before it
# builds.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Run the tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t .
      # Each test is named as it runs, and if they aren't done in five minutes Python says where every thread is
      # and stops: a window test that hangs on a Mac then shows which one, and at which line.
      - name: Run the tests, naming each
        if: runner.os == 'macOS'
        run: python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(300, exit=True); unittest.main(module=None, argv=['unittest', 'discover', '-s', 'tests', '-t', '.', '-v'])"
      # The window tests need a display, which a Linux runner doesn't have: xvfb gives them one.
      - name: Run the tests on a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          xvfb-run --auto-servernum python -m unittest discover -s tests -t .
